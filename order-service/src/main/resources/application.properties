spring.application.name=order-service

# Database Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/ordertb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

## Logging
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web=DEBUG

# Server Configuration
server.port=0

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=2000

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.stockService.registerHealthIndicator=true

# Sliding Window
resilience4j.circuitbreaker.instances.stockService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.stockService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.stockService.minimumNumberOfCalls=5

# Failure Threshold
resilience4j.circuitbreaker.instances.stockService.failureRateThreshold=50

# Open State
resilience4j.circuitbreaker.instances.stockService.waitDurationInOpenState=10s

# Half Open State
resilience4j.circuitbreaker.instances.stockService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.stockService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Exceptions
resilience4j.circuitbreaker.instances.stockService.recordExceptions=org.vidat.orderservice.exceptions.StockServiceException
resilience4j.circuitbreaker.instances.stockService.ignoreExceptions=org.vidat.orderservice.exceptions.InsufficientStockException

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.retry.instances.stockService.max-attempts=3
resilience4j.retry.instances.stockService.wait-duration=500ms
resilience4j.retry.instances.stockService.enable-exponential-backoff=true
resilience4j.retry.instances.stockService.exponential-backoff-multiplier=2
resilience4j.retry.instances.stockService.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.stockService.ignore-exceptions=org.vidat.orderservice.exceptions.InsufficientStockException

management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans