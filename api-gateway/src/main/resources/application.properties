spring.application.name=api-gateway
server.port=8080

management.endpoints.web.exposure.include=gateway,health

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# ---- Gateway routes (by Eureka service name) ----

spring.cloud.gateway.server.webflux.routes[0].id=catalog-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://catalog-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webflux.routes[1].id=stock-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://stock-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/stock/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders/**